
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>App Aluno</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
</head>
<body>
<div class="content">
<h1>Meu Painel</h1>

<div class="mobile-card">
<h3>Registrar Peso</h3>
<input id="peso" type="number">
<button onclick="salvarPeso()">Salvar</button>
</div>

<div class="mobile-card">
<h3>Gráfico de Evolução</h3>
<canvas id="grafico"></canvas>
</div>

<div class="mobile-card">
<h3>Treino</h3>
<textarea id="treino" placeholder="Descrição do treino"></textarea>
<input id="video" placeholder="Link do vídeo">
<button onclick="salvarTreino()">Salvar</button>
<div id="treinoAtual"></div>
</div>

<div class="mobile-card">
<h3>Dieta</h3>
<textarea id="dieta" placeholder="Plano alimentar"></textarea>
<button onclick="salvarDieta()">Salvar</button>
<div id="dietaAtual"></div>
</div>

<div class="mobile-card">
<h3>Foto Progresso</h3>
<input type="file" id="foto">
<button onclick="upload()">Enviar</button>
</div>

<button onclick="logout()">Sair</button>
</div>

<script src="../config/firebase.js"></script>
<script>
auth.onAuthStateChanged(u=>{
if(!u)window.location="../";
window.uid=u.uid;

db.collection("pesos").where("user","==",uid)
.onSnapshot(s=>{
const labels=[];const data=[];
s.forEach(doc=>{labels.push(doc.id.slice(0,5));data.push(doc.data().peso)});
new Chart(grafico,{type:"line",data:{labels:labels,datasets:[{label:"Peso",data:data}]}});
});
});

function salvarPeso(){
db.collection("pesos").add({peso:parseFloat(peso.value),user:uid});
}

function salvarTreino(){
db.collection("treinos").doc(uid).set({texto:treino.value,video:video.value});
}

function salvarDieta(){
db.collection("dietas").doc(uid).set({texto:dieta.value});
}

function upload(){
const file=foto.files[0];
storage.ref("progresso/"+uid+"/"+file.name).put(file).then(()=>alert("Foto enviada"));
}

function logout(){auth.signOut().then(()=>window.location="../")}
</script>
</body>
</html>
