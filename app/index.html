
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>App Aluno</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="content">
<h1>Meu Painel</h1>

<div class="card">
<h3>Treino</h3>
<div id="treino"></div>
</div>

<div class="card">
<h3>Dieta</h3>
<div id="dieta"></div>
</div>

<div class="card">
<h3>Registrar Peso</h3>
<input id="peso" type="number">
<button onclick="salvarPeso()">Salvar</button>
</div>

<button onclick="logout()">Sair</button>
</div>

<script src="../config/firebase.js"></script>
<script>
auth.onAuthStateChanged(u=>{
if(!u)window.location="../";
window.uid=u.uid;

db.collection("treinos").doc(uid).onSnapshot(doc=>{
if(doc.exists){treino.innerHTML=doc.data().texto}
});

db.collection("dietas").doc(uid).onSnapshot(doc=>{
if(doc.exists){dieta.innerHTML=doc.data().texto}
});
});

function salvarPeso(){
db.collection("pesos").add({peso:parseFloat(peso.value),user:uid});
}

function logout(){auth.signOut().then(()=>window.location="../")}
</script>
</body>
</html>
