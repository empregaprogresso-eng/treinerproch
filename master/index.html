
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Master</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="sidebar"><h2>Admin Master</h2><button onclick="logout()">Sair</button></div>
<div class="content">
<h1>Criar Personal</h1>
<div class="card">
<input id="nome" placeholder="Nome">
<input id="emailPersonal" placeholder="Email">
<button onclick="criar()">Criar</button>
</div>
</div>
<script src="../config/firebase.js"></script>
<script>
auth.onAuthStateChanged(u=>{if(!u)window.location="../"});
function logout(){auth.signOut().then(()=>window.location="../")}
function criar(){
db.collection("users").add({
nome:nome.value,
email:emailPersonal.value,
role:"personal",
ativo:true
});
alert("Personal criado.");
}
</script>
</body>
</html>
