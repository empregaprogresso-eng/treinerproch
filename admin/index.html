
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="sidebar">
<h2>LOGO<br><small>Personal Trainer</small></h2>
<a>Dashboard</a>
<a>Alunos</a>
<a>Treinos</a>
<a>Dieta</a>
<a>Progresso</a>
<a>Finanças</a>
</div>

<div class="content">
<div class="topbar">
<h1>Bem-vindo, Personal</h1>
<button class="primary">Adicionar Aluno</button>
</div>

<div class="grid">
<div class="card"><div>Alunos</div><div class="stat">24</div></div>
<div class="card"><div>Treinos Ativos</div><div class="stat">15</div></div>
<div class="card"><div>Dietas Ativas</div><div class="stat">12</div></div>
<div class="card"><div>Mensagens</div><div class="stat">5</div></div>
</div>

<div class="card">
<h3>Evolução</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>
new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:["Seg","Ter","Qua","Qui","Sex","Sab","Dom"],
datasets:[{label:"Evolução",data:[78,77,76,75,74,73,72],borderColor:"#f59e0b"}]
}
});
</script>

</body>
</html>
