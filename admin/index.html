
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
</head>
<body>

<div class="sidebar">
<h2>Painel SaaS</h2>
<button onclick="logout()">Sair</button>
</div>

<div class="content">
<h1>Dashboard</h1>

<div class="grid">
<div class="card"><div>Total Alunos</div><div class="stat" id="totalAlunos">0</div></div>
<div class="card"><div>Faturamento</div><div class="stat" id="financeiro">R$0</div></div>
</div>

<div class="card">
<h3>Cadastrar Aluno</h3>
<input id="nomeAluno" placeholder="Nome">
<input id="emailAluno" placeholder="Email">
<button onclick="criarAluno()">Criar</button>
</div>

<div class="card">
<h3>Evolução Geral</h3>
<canvas id="grafico"></canvas>
</div>

</div>

<script src="../config/firebase.js"></script>
<script>
auth.onAuthStateChanged(u=>{if(!u)window.location="../"});

function logout(){auth.signOut().then(()=>window.location="../")}

function criarAluno(){
auth.createUserWithEmailAndPassword(emailAluno.value,"123456")
.then(user=>{
db.collection("users").doc(user.user.uid).set({
nome:nomeAluno.value,
role:"aluno",
personal:auth.currentUser.uid
});
alert("Aluno criado com senha 123456");
});
}

db.collection("users").where("personal","==",auth.currentUser?.uid)
.onSnapshot(s=>{totalAlunos.innerText=s.size});

db.collection("financeiro").where("personal","==",auth.currentUser?.uid)
.onSnapshot(s=>{
let total=0;s.forEach(doc=>total+=doc.data().valor);
financeiro.innerText="R$"+total;
});

db.collection("pesos").onSnapshot(snapshot=>{
const labels=[];const data=[];
snapshot.forEach(doc=>{labels.push(doc.id.slice(0,5));data.push(doc.data().peso)});
new Chart(grafico,{type:"line",data:{labels:labels,datasets:[{label:"Peso",data:data}]}});
});
</script>

</body>
</html>
