
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel Personal</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="sidebar">
<h2>Painel Personal</h2>
<button onclick="logout()">Sair</button>
</div>
<div class="content">
<h1>Bem-vindo</h1>
<div id="info"></div>
</div>
<script src="../config/firebase.js"></script>
<script>
auth.onAuthStateChanged(u=>{
if(!u)window.location="../";
db.collection("users").doc(u.uid).get().then(doc=>{
info.innerHTML="Plano: <span class='badge'>"+doc.data().plano+"</span>";
});
});
function logout(){auth.signOut().then(()=>window.location="../")}
</script>
</body>
</html>
