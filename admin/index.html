
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="sidebar">
  <h2>Dashboard</h2>
  <a href="#">Alunos</a>
  <a href="#">Treinos</a>
  <a href="#">Dieta</a>
  <a href="#">Progresso</a>
  <button onclick="logout()">Sair</button>
</div>

<div class="content">
  <h1>Painel Geral</h1>

  <div class="grid">
    <div class="card"><h3>Total Alunos</h3><p id="totalAlunos">0</p></div>
    <div class="card"><h3>Pesos Registrados</h3><p id="totalPesos">0</p></div>
  </div>

  <div class="card">
    <h3>Evolução de Peso</h3>
    <canvas id="grafico"></canvas>
  </div>

  <div class="card">
    <h3>Novo Aluno</h3>
    <input type="text" id="nomeAluno" placeholder="Nome">
    <button onclick="addAluno()">Salvar</button>
  </div>
</div>

<script src="../config/firebase.js"></script>
<script>
auth.onAuthStateChanged(user=>{
  if(!user) window.location.href="../";
});

function logout(){
  auth.signOut().then(()=>window.location.href="../");
}

function addAluno(){
  const nome = document.getElementById("nomeAluno").value;
  db.collection("alunos").add({
    nome:nome,
    personal:auth.currentUser.uid
  });
}

db.collection("alunos").onSnapshot(snapshot=>{
  document.getElementById("totalAlunos").innerText = snapshot.size;
});

db.collection("pesos").onSnapshot(snapshot=>{
  document.getElementById("totalPesos").innerText = snapshot.size;

  const labels = [];
  const data = [];

  snapshot.forEach(doc=>{
    labels.push(doc.id.substring(0,5));
    data.push(doc.data().peso);
  });

  new Chart(document.getElementById("grafico"),{
    type:"line",
    data:{
      labels:labels,
      datasets:[{
        label:"Peso",
        data:data
      }]
    }
  });
});
</script>

</body>
</html>
