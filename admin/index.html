
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Personal</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="sidebar">
<h2>CRM Elite</h2>
<button onclick="logout()">Sair</button>
</div>
<div class="content">
<h1>Dashboard</h1>

<div class="grid">
<div class="card"><div>Total Alunos</div><div class="stat" id="total"></div></div>
<div class="card"><div>Faturamento</div><div class="stat" id="financeiro">R$0</div></div>
</div>

<h2>Alunos</h2>
<div id="lista"></div>
</div>

<script src="../config/firebase.js"></script>
<script>
auth.onAuthStateChanged(u=>{
if(!u)window.location="../";
window.uid=u.uid;

db.collection("users").where("personal","==",uid)
.onSnapshot(s=>{
total.innerText=s.size;
lista.innerHTML="";
let totalFinanceiro=0;
s.forEach(doc=>{
lista.innerHTML+=`
<div class="card">
<b>${doc.data().nome}</b><br>
<button onclick="abrir('${doc.id}')">Gerenciar</button>
</div>`;
});

db.collection("financeiro").where("personal","==",uid)
.onSnapshot(fin=>{
fin.forEach(f=>totalFinanceiro+=f.data().valor);
financeiro.innerText="R$"+totalFinanceiro;
});
});
});

function abrir(id){
window.location="aluno.html?id="+id;
}

function logout(){auth.signOut().then(()=>window.location="../")}
</script>
</body>
</html>
