
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel Personal</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="sidebar">
<h2>CRM Personal</h2>
<button onclick="logout()">Sair</button>
</div>
<div class="content">
<h1>Meus Alunos</h1>

<div class="card">
<input id="nomeAluno" placeholder="Nome">
<input id="emailAluno" placeholder="Email">
<button onclick="criarAluno()">Criar</button>
</div>

<div id="lista"></div>
</div>

<script src="../config/firebase.js"></script>
<script>
auth.onAuthStateChanged(u=>{
if(!u)window.location="../";
window.uid=u.uid;
db.collection("users").where("personal","==",u.uid)
.onSnapshot(s=>{
lista.innerHTML="";
s.forEach(doc=>{
lista.innerHTML+=`
<div class="card">
<b>${doc.data().nome}</b><br>
<button onclick="abrirAluno('${doc.id}')">Gerenciar</button>
</div>`;
});
});
});

function criarAluno(){
db.collection("users").add({
nome:nomeAluno.value,
email:emailAluno.value,
role:"aluno",
personal:uid,
ativo:true
});
alert("Aluno criado.");
}

function abrirAluno(id){
window.location="aluno.html?id="+id;
}

function logout(){auth.signOut().then(()=>window.location="../")}
</script>
</body>
</html>
